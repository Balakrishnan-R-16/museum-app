# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# IMPORTANT: Use "update" NOT "create" — "create" drops all tables on every restart!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ── Razorpay ─────────────────────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR

# ── JWT ──────────────────────────────────────────────────────────────────────
# Must be at least 32 characters (use a random string)
jwt.secret=${JWT_SECRET:MuseumTicketBookingSecureKey2024DefaultOnly}
jwt.expiration=86400000


# ── Gemini AI ────────────────────────────────────────────────────────────────
gemini.api-key=${GEMINI_API_KEY:AQ.Ab8RN6LPey8s9oNYVW3-GBnk1AmDtd0frkcQGQDrJ_5uUumLpA}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout-seconds=${GEMINI_TIMEOUT:30}
gemini.max-retries=${GEMINI_MAX_RETRIES:2}
gemini.max-reviews-per-analysis=${GEMINI_MAX_REVIEWS:50}

# ── Application URLs ─────────────────────────────────────────────────────────
app.frontend-url=http://localhost:5173
app.base-url=http://localhost:8080


logging.level.com.museum.ticketbooking=INFO
# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

# ── Location / Geocoding ────────────────────────────────────────────────────
# Set MAPBOX_API_KEY environment variable for Mapbox POI search (free tier: 100k req/month)
# If not set, falls back to Nominatim (limited POI data)
mapbox.api-key=${MAPBOX_API_KEY:}

# ── Google OAuth ────────────────────────────────────────────────────────────
# Set GOOGLE_CLIENT_ID from Google Cloud Console → APIs & Services → Credentials
google.client-id=${GOOGLE_CLIENT_ID:225854932574-mje552m89l6rfq0u9roc2bmrck36tk22.apps.googleusercontent.com}
